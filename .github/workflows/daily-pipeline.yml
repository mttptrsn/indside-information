name: Daily Insider Pipeline

on:
  schedule:
    # 9:17 PM Phoenix time, Monday through Friday.
    # The non-zero minute reduces the chance of GitHub schedule congestion.
    - cron: "17 21 * * 1-5"
      timezone: "America/Phoenix"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-insider-pipeline
  cancel-in-progress: false

jobs:
  update-site-data:
    name: Update pipeline and website data
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      PYTHONUNBUFFERED: "1"
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Validate required secret
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SEC_CONTACT_EMAIL:-}" ]]; then
            echo "::error::The SEC_CONTACT_EMAIL repository secret is missing."
            exit 1
          fi

          if [[ "${SEC_CONTACT_EMAIL}" != *"@"* ]]; then
            echo "::error::SEC_CONTACT_EMAIL does not appear to be a valid email."
            exit 1
          fi

      - name: Inject SEC contact email
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("pipeline/config/pipeline.json")
          placeholder = "__SEC_CONTACT_EMAIL__"
          email = os.environ["SEC_CONTACT_EMAIL"].strip()

          source = path.read_text(encoding="utf-8")
          count = source.count(placeholder)

          if count == 0:
              raise SystemExit(
                  "SEC email placeholder was not found in "
                  "pipeline/config/pipeline.json."
              )

          updated = source.replace(placeholder, email)

          # Validate before writing.
          json.loads(updated)

          path.write_text(updated, encoding="utf-8")
          PY

      - name: Install Python project
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [[ -f "pyproject.toml" ]]; then
            python -m pip install -e .
          elif [[ -f "requirements.txt" ]]; then
            python -m pip install -r requirements.txt
          else
            echo "::error::No pyproject.toml or requirements.txt was found."
            exit 1
          fi

      - name: Run backend tests
        shell: bash
        run: |
          set -euo pipefail
          pytest

      - name: Run complete data pipeline
        shell: bash
        run: |
          set -euo pipefail
          python -m pipeline.cli run-all

      - name: Export static website data
        shell: bash
        run: |
          set -euo pipefail
          python -m pipeline.cli export-web

      - name: Validate exported JSON
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("web/public/data")
          files = sorted(root.rglob("*.json"))

          if not files:
              raise SystemExit(
                  "No JSON files were exported to web/public/data."
              )

          for path in files:
              try:
                  with path.open(encoding="utf-8") as handle:
                      json.load(handle)
              except Exception as exc:
                  raise SystemExit(
                      f"Invalid JSON in {path}: {exc}"
                  ) from exc

          print(f"Validated {len(files):,} exported JSON files.")
          PY

      - name: Install frontend dependencies
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      - name: Lint frontend
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          npm run lint

      - name: Build frontend
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          npm run build

      - name: Restore public pipeline configuration
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- pipeline/config/pipeline.json

      - name: Verify secret was not written to tracked files
        shell: bash
        run: |
          set -euo pipefail

          if git grep -F "${SEC_CONTACT_EMAIL}" -- \
            ':!web/public/data' \
            ':!*.csv.gz'
          then
            echo "::error::The SEC contact email was found in a tracked file."
            exit 1
          fi

          if ! grep -q "__SEC_CONTACT_EMAIL__" \
            pipeline/config/pipeline.json
          then
            echo "::error::The public SEC email placeholder was not restored."
            exit 1
          fi

      - name: Commit updated website data
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Only commit static files consumed by Next.js.
          git add web/public/data

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No exported website data changed."
            exit 0
          fi

          git commit \
            -m "Update insider data $(date -u +'%Y-%m-%d')"

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebase and push updated data
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Write workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Daily Insider Pipeline"
            echo
            echo "- Tests: completed"
            echo "- Pipeline: completed"
            echo "- Static export: completed"
            echo "- Frontend validation: completed"
            echo "- Data committed: ${{ steps.commit.outputs.changed || 'false' }}"
          } >> "$GITHUB_STEP_SUMMARY"
