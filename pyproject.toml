[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insider"
version = "0.4.0"
description = "Causal insider-purchase research pipeline using SEC data and yfinance."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Insider Contributors"}]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "requests>=2.32,<3",
  "scipy>=1.14,<2",
  "yfinance>=0.2.54,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9"
]

[project.scripts]
insider = "pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.setuptools.package-data]
pipeline = ["config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
